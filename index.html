<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Casino</title>

    <!-- Correct fonts (same as TabType) -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

    <h1 id="title">Tab Casino</h1>

    <main>

        <!-- Balance + Goal + Code Row -->
        <div id="balance-row">
            <div id="balance">Balance: <span id="balance-value">100</span></div>
            <div id="goal">Goal: <span id="goal-value">2500</span></div>
            <div id="goal-code">code</div>
        </div>

        <!-- Goal Bar -->
        <div id="goal-bar">
            <div id="goal-bar-fill"></div>
        </div>
        <div id="goal-bar-text">0 / 2500</div>

        <!-- Game Panel -->
        <div id="game-panel">

            <label for="bet">Bet Amount</label>
            <input type="number" id="bet" min="1" value="10">

            <label for="mode">Mode</label>
            <select id="mode">
                <option value="50">50/50</option>
                <option value="70">70% Win</option>
                <option value="30">30% Win</option>
            </select>

            <button id="playBtn">Play</button>
            <button id="restartBtn">Restart</button>

            <div id="message"></div>
        </div>

    </main>

    <!-- Confetti -->
    <div id="confetti-container"></div>

    <!-- Your JS -->
    <script src="script.js"></script>

</body>
</html>
