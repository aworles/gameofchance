<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Casino</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- Title -->
  <h1 id="title">Tab Casino</h1>

  <main>

    <!-- Balance + Code Row -->
    <div id="balance-row">
      <div id="balance-display">Balance: 100 tabs</div>
      <div id="goal-code">Code: ---</div>
    </div>

    <!-- Goal Bar -->
    <div id="goal-bar">
      <div id="goal-bar-fill"></div>
    </div>
    <div id="goal-bar-text">Goal: 5000 tabs</div>

    <!-- Game Panel -->
    <div id="game-panel">

      <label>Bet Amount</label>
      <input id="betInput" type="number" min="1" placeholder="Enter bet">

      <label>Choose Color</label>
      <select id="colorInput">
        <option value="red">Red</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>

      <label>Choose Number</label>
      <select id="numberInput">
        <!-- No document.write — static options so they are visible -->
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>

      <button id="playBtn">Play</button>

      <div id="message"></div>

    </div>

    <!-- Restart Button -->
    <button id="restartBtn">Restart</button>

  </main>

  <!-- Confetti -->
  <div id="confetti-container"></div>

  <!-- JS loaded LAST so everything exists before script runs -->
  <script src="main.js"></script>

</body>
</html>
